# This workflow runs automatically and updates the README.md file with the
# latest track on Last.fm.
name: Update Track
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
jobs:
  get-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Enable corepack
        run: corepack enable
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript
        run: pnpm type-check
      - name: Setup environment
        run: cp .env.example .env
      - name: Get the latest track from Last.fm
        timeout-minutes: 5
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        run: pnpm get-latest-track
      - name: Replace the README.md with the latest track
        run: cp README.template.md README.md
      - name: Format the README.md
        run: pnpm exec prettier --write README.md
      # This regex is coupled to the timestamp line in the template.
      # If that line's format changes, this stops matching.
      - name: Check for changes beyond the timestamp
        id: readme
        run: |
          if git diff --quiet -I '^<sub>_Last updated: ' -- README.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push the updated README.md
        if: steps.readme.outputs.changed == 'true'
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: 'README.md'
          commit: --no-gpg-sign --no-verify --signoff
      - name: Health check
        run: curl -fsS -m 10 --retry 5 -o /dev/null ${{ secrets.HEALTH_CHECK_ENDPOINT }}
